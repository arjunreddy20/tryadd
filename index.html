<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="h1">Please SignUp Here!</h1>
    <div class="input-box">
        <input type="text" placeholder="Enter your name" id="name"><br><br>
        <input type="text" placeholder="Enter your email" id="email"><br><br>
        <input type="text" placeholder="Enter your phone number" id="phone"><br><br>
        <input type="password" placeholder="Enter your password" id="password"><br><br>
        <button class="SignUpBtn" type="submit">SignUp</button><br><br>

    </div>

</body>
</html>
